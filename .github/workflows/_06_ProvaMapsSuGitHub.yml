# Prova: Google Maps aperto con Chrome da una macchina di GitHub con la sessione Google dell'account del motore (segreto MAPS_SESSIONE_GOOGLE),
# come lo apre il motore di download sul server. I cookie non si stampano mai.
# Il Chrome passa dall'uscita fissa del server (tunnel Cloudflare uscita-maps): Google vede sempre l'indirizzo del server.
# Apre la scheda diretta di un luogo pubblico (il Colosseo), conta le foto e le recensioni che Maps carica: nessun dato dei clienti.
name: Prova Maps su GitHub
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prova:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: _02_Download }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -q playwright
      - name: Uscita fissa di Maps attraverso il server
        shell: pwsh
        env:
          MAPS_USCITA_CHIAVE: ${{ secrets.MAPS_USCITA_CHIAVE }}
          MAPS_INDIRIZZO_DEL_SERVER: ${{ secrets.MAPS_INDIRIZZO_DEL_SERVER }}
          PYTHONIOENCODING: utf-8
        run: |
          $u = "_02_Download/_01_StrumentiDelMotore/_04_CoordinatoreDelMotore/_05_UscitaFissaDiMapsSullaMacchinaDiGitHub.py"
          Invoke-WebRequest -UseBasicParsing https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          Start-Process .\cloudflared.exe -ArgumentList "access","tcp","--hostname","uscita-maps.depthxlabs.com","--url","127.0.0.1:8899","--logfile","cloudflared_uscita.log" -WindowStyle Hidden
          Start-Process python -ArgumentList "-B",$u,"avvia" -WindowStyle Hidden
          Start-Sleep 8
          python -B $u verifica
          if ($LASTEXITCODE) { if (Test-Path cloudflared_uscita.log) { Get-Content cloudflared_uscita.log -Tail 15 }; exit 1 }
      - name: Maps con Chrome
        shell: python
        env:
          MAPS_SESSIONE_GOOGLE: ${{ secrets.MAPS_SESSIONE_GOOGLE }}
        run: |
          import json, os, re, time
          from playwright.sync_api import sync_playwright
          SCHEDA = "https://www.google.com/maps/search/?api=1&query=Colosseo&query_place_id=ChIJrRMgU7ZhLxMRxAOFkC7I8Sg&hl=it"
          with sync_playwright() as p:
              browser = p.chromium.launch(channel="chrome", headless=False, args=["--lang=it-IT", "--proxy-server=http://127.0.0.1:8898"])
              contesto = browser.new_context(locale="it-IT", viewport={"width": 1400, "height": 900})
              cookie = []
              for voce in json.loads(os.environ.get("MAPS_SESSIONE_GOOGLE") or "[]"):
                  nuovo = {"name": voce["name"], "value": str(voce.get("value", "")), "domain": voce["domain"], "path": voce.get("path") or "/",
                           "httpOnly": bool(voce.get("httpOnly")), "secure": bool(voce.get("secure"))}
                  if isinstance(voce.get("expires"), (int, float)) and voce["expires"] > 0 and not voce.get("session"):
                      nuovo["expires"] = float(voce["expires"])
                  if voce.get("sameSite") in ("Strict", "Lax") or (voce.get("sameSite") == "None" and nuovo["secure"]):
                      nuovo["sameSite"] = voce["sameSite"]
                  cookie.append(nuovo)
              try:
                  contesto.add_cookies(cookie)
              except Exception as errore:
                  raise SystemExit(f"sessione Google non caricata: {type(errore).__name__}") from None
              print("cookie della sessione Google caricati:", len(cookie))
              pagina = contesto.new_page()
              pagina.goto(SCHEDA, timeout=60000)
              time.sleep(6)
              for testo in ("Rifiuta tutto", "Reject all"):
                  try:
                      pagina.get_by_role("button", name=testo).first.click(timeout=4000); time.sleep(5); break
                  except Exception:
                      pass
              try:
                  pagina.wait_for_selector("h1", timeout=30000)
              except Exception:
                  pass
              time.sleep(4)
              pagina.screenshot(path="maps_scheda.png")
              print("indirizzo della pagina:", pagina.url[:120])
              print("titolo della scheda:", (pagina.locator("h1").first.inner_text(timeout=5000) if pagina.locator("h1").count() else "nessuno"))
              print("vista limitata:", pagina.get_by_text(re.compile("vista limitata|insieme limitato|limited view|limited set", re.I)).count() > 0)
              print("account collegato:", pagina.get_by_role("link", name=re.compile(r"^(Accedi|Sign in)$")).count() == 0 and pagina.get_by_role("button", name=re.compile(r"^(Accedi|Sign in)$")).count() == 0)
              print("immagini di Google nella scheda:", pagina.locator("img[src*='googleusercontent']").count())
              try:
                  pagina.get_by_role("tab", name=re.compile(r"^(Recensioni|Reviews)")).first.click(timeout=20000)
                  time.sleep(6)
                  pannello = pagina.locator("div[data-review-id]")
                  # si scorre il contenitore delle recensioni, non la pagina: l'ultima recensione caricata va in vista e Maps carica le successive
                  # attraverso l'uscita fissa Maps carica le recensioni più lentamente: si scorre fino a 120 recensioni o 60 giri
                  for giro in range(60):
                      pagina.evaluate("() => { const r = document.querySelectorAll('div[data-review-id]'); if (r.length) r[r.length - 1].scrollIntoView(); }")
                      time.sleep(2)
                      if len(set(pannello.evaluate_all("e => e.map(x => x.getAttribute('data-review-id'))"))) >= 120:
                          break
                  print("recensioni caricate:", len(set(pannello.evaluate_all("e => e.map(x => x.getAttribute('data-review-id'))"))))
                  pagina.screenshot(path="maps_recensioni.png")
              except Exception as errore:
                  print("scheda Recensioni non raggiunta:", type(errore).__name__)
              try:
                  pagina.goto(SCHEDA, timeout=60000); time.sleep(6)
                  pagina.get_by_role("button", name=re.compile(r"^(Foto|Photos)")).first.click(timeout=20000)
                  time.sleep(6)
                  for giro in range(4):
                      pagina.mouse.move(300, 600); pagina.mouse.wheel(0, 4000); time.sleep(2)
                  print("foto caricate nella galleria:", pagina.locator("a[data-photo-index], div[data-photo-index]").count())
                  pagina.screenshot(path="maps_foto.png")
              except Exception as errore:
                  print("galleria delle foto non raggiunta:", type(errore).__name__)
              browser.close()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-maps
          path: maps_*.png
          retention-days: 3
  motore:
    # la stessa prova con il Chrome del motore di download (Chrome acceso a parte e collegato con CDP), sulla scheda pubblica del Colosseo
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: _02_Download }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -q -r _02_Download/_00_LibrerieDelMotore.txt
      - name: Uscita fissa di Maps attraverso il server
        shell: pwsh
        env:
          MAPS_USCITA_CHIAVE: ${{ secrets.MAPS_USCITA_CHIAVE }}
          MAPS_INDIRIZZO_DEL_SERVER: ${{ secrets.MAPS_INDIRIZZO_DEL_SERVER }}
          PYTHONIOENCODING: utf-8
        run: |
          $u = "_02_Download/_01_StrumentiDelMotore/_04_CoordinatoreDelMotore/_05_UscitaFissaDiMapsSullaMacchinaDiGitHub.py"
          Invoke-WebRequest -UseBasicParsing https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-windows-amd64.exe -OutFile cloudflared.exe
          Start-Process .\cloudflared.exe -ArgumentList "access","tcp","--hostname","uscita-maps.depthxlabs.com","--url","127.0.0.1:8899","--logfile","cloudflared_uscita.log" -WindowStyle Hidden
          Start-Process python -ArgumentList "-B",$u,"avvia" -WindowStyle Hidden
          Start-Sleep 8
          python -B $u verifica
          if ($LASTEXITCODE) { if (Test-Path cloudflared_uscita.log) { Get-Content cloudflared_uscita.log -Tail 15 }; exit 1 }
      - name: Maps con il Chrome del motore
        env:
          PYTHONIOENCODING: utf-8
          MAPS_USCITA_FISSA: http://127.0.0.1:8898
          MAPS_SESSIONE_GOOGLE: ${{ secrets.MAPS_SESSIONE_GOOGLE }}
        run: |
          cd _02_Download/_01_StrumentiDelMotore/_04_CoordinatoreDelMotore
          python -B - <<'PROVA'
          import time
          import _02_PercorsiChiaviEFunzioniComuni as comune
          import _01_DownloadDiSchedaFotoERecensioniDaGoogleMaps as maps
          from playwright.sync_api import sync_playwright
          SCHEDA = "https://www.google.com/maps/place/?q=place_id:ChIJrRMgU7ZhLxMRxAOFkC7I8Sg"
          import os
          os.makedirs(comune.CARTELLA_DEL_REGISTRO, exist_ok=True); os.makedirs(comune.CARTELLA_TEMPORANEA, exist_ok=True)
          print("cookie preparati:", len(comune.cookieDellaSessioneGoogle()))
          def prova(nome, contesto):
              pagina = contesto.new_page()
              pagina.set_viewport_size({"width": 1400, "height": 900})
              try:
                  maps.apri(pagina, SCHEDA)
                  print(nome, "VISTA COMPLETA")
              except maps.FermoDiMaps as fermo:
                  print(nome, "VISTA LIMITATA")
              pagina.screenshot(path=f"motore_{nome}.png")
              pagina.close()
          with sync_playwright() as programma:
              browser = comune.chromeDiMaps(programma)
              prova("A_ChromeDelMotore", browser.contexts[0])
              nuovo = browser.new_context(locale="it-IT")
              comune.sessioneGoogleDelMotore(nuovo)
              prova("B_ChromeDelMotoreContestoNuovo", nuovo)
              lanciato = programma.chromium.launch(channel="chrome", headless=False, args=comune.OPZIONI_DEL_CHROME_DI_MAPS)
              contesto = lanciato.new_context(locale="it-IT")
              comune.sessioneGoogleDelMotore(contesto)
              prova("C_ChromeDiPlaywrightFuoriSchermo", contesto)
              lanciato.close()
              lanciato = programma.chromium.launch(channel="chrome", headless=False, args=["--lang=it-IT", "--proxy-server=http://127.0.0.1:8898"])
              contesto = lanciato.new_context(locale="it-IT")
              comune.sessioneGoogleDelMotore(contesto)
              prova("D_ChromeDiPlaywrightComeLaProva", contesto)
              lanciato.close()
          PROVA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-motore
          path: _02_Download/_01_StrumentiDelMotore/_04_CoordinatoreDelMotore/motore_*.png
          retention-days: 3
