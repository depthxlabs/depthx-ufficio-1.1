# La fabbrica delle demo, Linea 1.1 Outbound Websites: un cliente per macchina, fino a 20 macchine insieme.
# Il codice è pubblico; i dati dei clienti stanno nell'archivio privato depthx-dati-1.1 e le chiavi nei segreti.
# Regola: il registro pubblico di questo lavoro non mostra mai nomi o dati dei clienti. I messaggi della fabbrica vanno in un
# file che si salva solo nell'archivio privato (_08_Fabbrica/esiti/<cliente>), insieme agli eventi e alla scheda per l'approvazione.
name: Fabbrica delle demo
on:
  workflow_dispatch:
    inputs:
      clienti: { description: "Codici dei clienti, come elenco JSON: [\"S1_HOT_LOM_001\", ...]", required: true }
permissions:
  contents: read
jobs:
  demo:
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cliente: ${{ fromJSON(inputs.clienti) }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      LINEA: C:\_01_DepthX\_01_Linea1_ProductionDepartement\_01_Linea_1.1_OUTBOUND_WEBSITES
      FABBRICA: C:\_01_DepthX\_01_Linea1_ProductionDepartement\_01_Linea_1.1_OUTBOUND_WEBSITES\_05_1.1_D_FabbricaProduzioneDemoDelSito
      RCLONE_CARTELLA: C:\_02_DepthXSoftware\_02_RCloneDepthX
      FREELLM: C:\fl
      FREELLM_VERSIONE: 9d2b4b407b12e489ecd35320cd630d5ff97cd666
    defaults:
      run: { shell: pwsh }
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with: { path: codice, sparse-checkout: _04_Fabbrica }
      - uses: actions/checkout@v4
        with:
          repository: depthxlabs/depthx-dati-1.1
          ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}"
          path: dati
          sparse-checkout: |
            _07_FreeLLMAPI
            _08_Fabbrica
      - name: Gli stessi percorsi del server
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force | Out-Null
          New-Item -ItemType Directory -Force "$env:LINEA" | Out-Null
          New-Item -ItemType Junction -Path "$env:FABBRICA" -Target "$env:GITHUB_WORKSPACE\codice\_04_Fabbrica\_05_1.1_D_FabbricaProduzioneDemoDelSito" | Out-Null
          $motore = "$env:LINEA\_04_1.1_C_DownloadMaterialeClienti"
          New-Item -ItemType Directory -Force "$motore\_01_StrumentiDelMotore\_05_RegistroEStatoDelMotore", "$motore\_06_CaricamentoSuDrive" | Out-Null
          Copy-Item dati\_08_Fabbrica\stato.json "$motore\_01_StrumentiDelMotore\_05_RegistroEStatoDelMotore\stato.json"
          Copy-Item dati\_08_Fabbrica\_02_CartelleDeiClientiSuDrive.json "$motore\_06_CaricamentoSuDrive\_02_CartelleDeiClientiSuDrive.json"
      - name: rclone con le sue configurazioni
        env:
          LETTURA: ${{ secrets.FABBRICA_RCLONE_LETTURA }}
          SCRITTURA: ${{ secrets.FABBRICA_RCLONE_SCRITTURA }}
        run: |
          New-Item -ItemType Directory -Force "$env:RCLONE_CARTELLA" | Out-Null
          Invoke-WebRequest https://downloads.rclone.org/rclone-current-windows-amd64.zip -OutFile rclone.zip
          Expand-Archive rclone.zip -DestinationPath rclone
          Copy-Item (Get-ChildItem rclone -Recurse -Filter rclone.exe | Select-Object -First 1).FullName "$env:RCLONE_CARTELLA\rclone.exe"
          [IO.File]::WriteAllText("$env:RCLONE_CARTELLA\rclone.conf", $env:LETTURA)
          [IO.File]::WriteAllText("$env:RCLONE_CARTELLA\rclone_scrittura.conf", $env:SCRITTURA)
      - uses: actions/cache@v4
        with:
          path: C:\fl
          key: freellmapi-${{ env.FREELLM_VERSIONE }}-v1
      - name: FreeLLMAPI sulla macchina
        env:
          CIFRATURA: ${{ secrets.FREELLM_CHIAVE_DI_CIFRATURA }}
          CHIAVE: ${{ secrets.FREELLM_CHIAVE_UNICA }}
        run: |
          if (-not (Test-Path "$env:FREELLM\server\dist\index.js")) {
            git clone -q https://github.com/tashfeenahmed/freellmapi $env:FREELLM
            git -C $env:FREELLM checkout -q $env:FREELLM_VERSIONE
            Push-Location $env:FREELLM; npm ci --silent; npm run build:server --silent; Pop-Location
          }
          New-Item -ItemType Directory -Force "$env:FREELLM\server\data" | Out-Null
          Copy-Item dati\_07_FreeLLMAPI\freeapi.db "$env:FREELLM\server\data\freeapi.db" -Force
          [IO.File]::WriteAllText("$env:FREELLM\.env", "ENCRYPTION_KEY=$($env:CIFRATURA.Trim())`nPORT=3001`nHOST=127.0.0.1`nNODE_ENV=production`n")
          $chiave = "C:\_02_DepthXSoftware\_01_CentroGestioneDepthX\V1.0(161126_1124)\_01_StrumentiDiLavoroPerIlServer\_01_ChiaviAccessiServiziTerzeParti\_11_FreeLLMAPI"
          New-Item -ItemType Directory -Force $chiave | Out-Null
          [IO.File]::WriteAllText("$chiave\_01_ChiaveUnica.txt", $env:CHIAVE.Trim())
          Start-Process node -ArgumentList "server/dist/index.js" -WorkingDirectory $env:FREELLM -WindowStyle Hidden -RedirectStandardOutput C:\freellm.log -RedirectStandardError C:\freellm_errori.log
          for ($i = 0; $i -lt 60; $i++) { try { (New-Object Net.Sockets.TcpClient).Connect("127.0.0.1", 3001); Write-Host "FreeLLMAPI acceso"; break } catch { Start-Sleep 2 } }
      - name: Controllo di FreeLLMAPI
        env:
          CHIAVE: ${{ secrets.FREELLM_CHIAVE_UNICA }}
        run: |
          Start-Sleep 15
          $intestazioni = @{ Authorization = "Bearer $($env:CHIAVE.Trim())" }
          foreach ($modello in "nemotron-3.5-super-vl", "auto") {
            $corpo = @{ model = $modello; messages = @(@{ role = "user"; content = "Rispondi solo con la parola OK." }) } | ConvertTo-Json -Depth 5
            try {
              $risposta = Invoke-WebRequest -Uri http://127.0.0.1:3001/v1/chat/completions -Method Post -Headers $intestazioni -ContentType "application/json" -Body $corpo -TimeoutSec 90
              Write-Host "modello $modello`: risposta $($risposta.StatusCode), $($risposta.Content.Length) caratteri"
            } catch { Write-Host "modello $modello`: NOTGO $($_.Exception.Response.StatusCode.value__) $($_.Exception.Message -replace 'Bearer \S+','')" }
          }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -q pillow==13.0.0 pillow_heif==1.8.1 numpy==2.5.4 onnxruntime==1.31.1 requests==2.34.2 cryptography==50.0.2
      - name: La demo del cliente
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLIENTE: ${{ matrix.cliente }}
        run: |
          New-Item -ItemType Directory -Force C:\esito | Out-Null
          $inizio = Get-Date
          Push-Location "$env:FABBRICA\_02_CoordinatoreDiLavoroDellaFabbrica"
          cmd /c "python -B _01_CoordinatoreDellaFabbrica.py --cliente %CLIENTE% > C:\esito\fabbrica.log 2>&1"
          Pop-Location
          $minuti = [math]::Round(((Get-Date) - $inizio).TotalMinutes, 1)
          [IO.File]::WriteAllText("C:\esito\minuti.txt", "$minuti")
          Write-Host "fabbrica chiusa in $minuti minuti"
      - name: Esiti nell'archivio privato
        if: always()
        env:
          CLIENTE: ${{ matrix.cliente }}
        run: |
          $uscita = "dati\_08_Fabbrica\esiti\$env:CLIENTE"
          New-Item -ItemType Directory -Force $uscita | Out-Null
          Copy-Item C:\esito\* $uscita -ErrorAction SilentlyContinue
          Copy-Item C:\freellm_errori.log "$uscita\freellm_errori.log" -ErrorAction SilentlyContinue
          Copy-Item C:\freellm.log "$uscita\freellm.log" -ErrorAction SilentlyContinue
          $registro = "$env:FABBRICA\_01_StrumentiDellaFabbrica\_04_RegistroLogDellaFabbrica\_02_RegistroProduzione"
          if (Test-Path $registro) { Copy-Item $registro "$uscita\registro" -Recurse }
          $scheda = "$env:FABBRICA\_01_StrumentiDellaFabbrica\_09_DemoInApprovazione\$env:CLIENTE"
          if (Test-Path $scheda) { Copy-Item $scheda "$uscita\approvazione" -Recurse }
          Set-Location dati
          git add --sparse "_08_Fabbrica/esiti/$env:CLIENTE"
          git -c user.name="DepthX Fabbrica 1.1" -c user.email=outbound@depthxlabs.com commit -q -m "Fabbrica: esito di una demo"
          for ($n = 1; $n -le 6; $n++) { git pull -q --rebase origin main; git push -q origin HEAD:main; if ($LASTEXITCODE -eq 0) { Write-Host "esito salvato"; break }; Start-Sleep ($n * 4) }
