# Prova dei modelli gratuiti al posto di Claude, Linea 1.1 Outbound Websites.
# Riconoscimento delle foto con un modello di immagini sulla macchina e rapporto di unicità con GitHub Models,
# sui clienti già fatti da Claude in dati/_05_ProveDeiModelli. L'esito torna nell'archivio privato; nel registro solo numeri.
name: Prova modelli gratuiti
on:
  workflow_dispatch:
    inputs:
      foto: { description: "Foto per cliente", required: false, default: "90" }
permissions:
  contents: read
  models: read
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      DATI_RICERCA: dati
      FOTO_PER_CLIENTE: ${{ inputs.foto }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.1, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _05_ProveDeiModelli }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision && pip install -q open_clip_torch pillow requests
      - name: La prova
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MOTORE_DRIVE_TOKEN: ${{ secrets.MOTORE_DRIVE_TOKEN }}
        run: python -B _03_ModelliGratuiti/_03_ProvaSuiClientiGiaFatti.py
      - name: L'esito torna nei dati
        if: always()
        run: |
          cd dati
          git add _05_ProveDeiModelli
          git -c user.name="DepthX Prove 1.1" -c user.email=outbound@depthxlabs.com commit -q -m "Prova dei modelli gratuiti: esito" || exit 0
          for n in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep $((n * 3)); done
