# Download del materiale clienti della Linea 1.1 su GitHub (dal 23/11/2026).
# Il server prepara la coda nel repository privato dei dati (_04_Download/Coda/<codice>.json): fino a 20 gruppi di clienti.
# Ogni motore, su una macchina Windows, fa girare il lavoratore del motore di download per il suo gruppo: Google Maps dal servizio Maps del server,
# sito, Instagram e YouTube, caricamento su Drive nella cartella del cliente. Il riconoscimento delle foto e il rapporto di unicità
# con Claude si fanno sul server: qui il cliente resta "DA RICONOSCERE". Le righe del registro tornano nel repository dei dati.
name: Download clienti
run-name: "${{ inputs.codice }}"
on:
  workflow_dispatch:
    inputs:
      codice: { description: "Codice della coda, per esempio Download001", required: true }
concurrency: { group: "download-${{ inputs.codice }}", cancel-in-progress: false }
permissions:
  contents: read
jobs:
  piano:
    name: Piano della coda
    runs-on: ubuntu-latest
    outputs:
      gruppi: ${{ steps.piano.outputs.gruppi }}
    steps:
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.1, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _04_Download/Coda }
      - id: piano
        run: |
          python3 -c "import json,os; c=json.load(open('dati/_04_Download/Coda/${{ inputs.codice }}.json',encoding='utf-8')); open(os.environ['GITHUB_OUTPUT'],'a').write('gruppi='+json.dumps([str(n) for n in range(len(c['gruppi']))])+'\n')"
  download:
    name: Gruppo ${{ matrix.gruppo }}
    needs: piano
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        gruppo: ${{ fromJSON(needs.piano.outputs.gruppi) }}
    defaults:
      run: { shell: bash }
    env:
      PYTHONIOENCODING: utf-8
      TZ: Europe/Rome
      MOTORE_SENZA_CLAUDE: "1"
      MOTORE_CODA: ${{ github.workspace }}\dati\_04_Download\Coda\${{ inputs.codice }}.json
      # Google Maps si legge solo sul server, nell'unico Chrome con l'account del motore: qui si chiede la scheda al servizio Maps del server
      # e la sessione Google non esce mai dal server
      MAPS_WORKER: https://maps-download.depthxlabs.com
      MAPS_CHIAVE_DEL_WORKER: ${{ secrets.MAPS_CHIAVE_DEL_WORKER }}
    steps:
      # solo il codice del download: i percorsi lunghi della fabbrica non entrano nel disco di Windows
      - uses: actions/checkout@v4
        with: { sparse-checkout: _02_Download }
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.1, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _04_Download }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -q -r _02_Download/_00_LibrerieDelMotore.txt
      - name: ffmpeg e ffprobe per i video
        run: |
          for n in 1 2 3 4 5; do
            curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip && break
            sleep $((n * 5))
          done
          unzip -q ffmpeg.zip -d ffmpeg
          CARTELLA=$(cygpath -w "$(dirname "$(find "$PWD/ffmpeg" -name ffprobe.exe | head -n 1)")")
          echo "$CARTELLA" >> "$GITHUB_PATH"
          "$(find "$PWD/ffmpeg" -name ffprobe.exe | head -n 1)" -version > /dev/null && echo "ffprobe pronto"
      - name: rclone, l'accesso a Drive
        env:
          CONFIGURAZIONE: ${{ secrets.DRIVE_RCLONE_CONF }}
        run: |
          curl -sSL -o rclone.zip https://downloads.rclone.org/rclone-current-windows-amd64.zip
          unzip -q rclone.zip -d rclone
          PROGRAMMA=$(cygpath -w "$(find "$PWD/rclone" -name rclone.exe | head -n 1)")
          printf '%s' "$CONFIGURAZIONE" > "$RUNNER_TEMP/rclone.conf"
          echo "MOTORE_RCLONE=$PROGRAMMA" >> "$GITHUB_ENV"
          echo "MOTORE_RCLONE_CONF=$(cygpath -w "$RUNNER_TEMP/rclone.conf")" >> "$GITHUB_ENV"
      - name: Chiavi del motore dai segreti
        env:
          META: ${{ secrets.MOTORE_TOKEN_META }}
        run: |
          K=_02_Download/_01_StrumentiDelMotore/_02_ChiaviDiAccessoAServiziDiTerzeParti
          mkdir -p "$K"
          printf '%s' "$META" > "$K/_04_TokenAccessoMetaDevelopers.md"
      - name: Il motore scarica il gruppo
        run: |
          python -c "import json,os; c=json.load(open(os.environ['MOTORE_CODA'],encoding='utf-8')); json.dump(c['elenco'], open('_02_Download/_02_LetturaDalCRM/_04_ElencoDeiBlocchiDelCrm.json','w',encoding='utf-8'), ensure_ascii=False)"
          python -c "import json,os; c=json.load(open(os.environ['MOTORE_CODA'],encoding='utf-8')); print('\n'.join(f\"{l['industria']} {','.join(l['clienti'])}\" for l in c['gruppi'][${{ matrix.gruppo }}]))" > lotti.txt
          ESITO=0
          while read -r IND IDS; do
            python -B _02_Download/_01_StrumentiDelMotore/_04_CoordinatoreDelMotore/_01_CoordinatoreELavoratoriDelMotore.py --lavoratore --industria "$IND" --clienti "$IDS" --giro 2 || ESITO=1
          done < lotti.txt
          exit $ESITO
      - name: Le righe del registro tornano nei dati
        if: always()
        run: |
          R=_02_Download/_01_StrumentiDelMotore/_05_RegistroEStatoDelMotore/registro.jsonl
          [ -f "$R" ] || exit 0
          cd dati
          git config user.name "DepthX Download 1.1"; git config user.email outbound@depthxlabs.com
          mkdir -p "_04_Download/Esiti/${{ inputs.codice }}"
          cp "../$R" "_04_Download/Esiti/${{ inputs.codice }}/Gruppo${{ matrix.gruppo }}.jsonl"
          git add -A && git commit -qm "${{ inputs.codice }}: esiti del gruppo ${{ matrix.gruppo }}"
          for n in $(seq 1 30); do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
